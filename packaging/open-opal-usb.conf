# systemd-tmpfiles: disable USB3 link power management (U1/U2) for the Opal C1 in both
# firmware personalities (f63d = Opal webcam, f63b = DepthAI). The Myriad X is known to
# misbehave in low-power link states. The quirk applies the next time the camera
# enumerates, which it does every time Open Opal connects or quits.
# Install: sudo cp packaging/open-opal-usb.conf /etc/tmpfiles.d/ && sudo systemd-tmpfiles --create /etc/tmpfiles.d/open-opal-usb.conf
# Note: this replaces any other usbcore quirks set at runtime.
w /sys/module/usbcore/parameters/quirks - - - - 03e7:f63d:k,03e7:f63b:k
